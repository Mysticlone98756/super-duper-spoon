<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kawarp Local Wallpaper</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load am-lyrics web component -->
</head>

<body>
    <!-- Kawarp Background -->
    <canvas id="bg"></canvas>

    <!-- Main App Layout -->
    <div class="app-layout">
        <!-- Left Panel (with ID for stronger CSS) -->
        <div id="left-panel">
            <div class="cover-art" id="cover-container" style="position: relative; overflow: hidden; width: 580px; height: 580px; border-radius: 8px;">
                <!-- 1. The original static image (fallback) -->
            <img id="cover-image" src="cover.png" alt="Album Art" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;"> 
                <!-- 2. The new animated video player -->
            <video id="cover-video" autoplay loop muted playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none;"></video>
        </div>


            <div class="track-info">
                <div class="track-title" id="track-title"><span id="track-title-text">No track playing</span></div>
                <div class="track-artist" id="track-artist">Unknown Artist</div>
            </div>

            <div class="media-controls">
                <!-- Previous Track Button (sfBackwardFill) -->
                <button id="sfBackwardFill" title="Previous Track">
                    <img src="sfBackwardFill.svg" alt="Previous Track" width="24" height="24">
                </button>

                <!-- Play / Pause Button (sfPlayFill / sfPauseFill) -->
                <button id="sfPlayFill" class="play-btn" title="Play / Pause">
                    <img src="sfPlayFill.svg" alt="Play / Pause" width="24" height="24">
                </button>

                <!-- Next Track Button (sfForwardFill) -->
                <button id="sfForwardFill" title="Next Track">
                    <img src="sfForwardFill.svg" alt="Next Track" width="24" height="24">
                </button>
            </div>
        </div>

        <!-- Right Panel (Lyrics) -->
        <div class="right-panel">
            <div id="lyric-container">
                <am-lyrics
                    id="player"
                    song-title=""
                    song-artist=""
                    font-family="'SF Pro Text', -apple-system, sans-serif"
                    autoscroll
                    interpolate="true"
                ></am-lyrics>
            </div>
        </div>
    </div>

    <!-- ─── Scripts ─── -->
    
    <script type="module">
        import 'https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js';
    </script>
    
   <script src="am-lyrics-fix.js"></script>
    <!-- 1. Wallapaper Engine bridge (metadata + cover saving) -->
    <script src="wallapaper_engine.js"></script>

    <!-- 1.5 Cover changer (snatches from iTunes Search API) -->
    <script src="cover-changer.js"></script>

    <!-- 2. Media bridge (polling Windows server for position) -->
    <script src="media-bridge.js"></script>
    
    <script src="spotify-cover.js"></script>
    <!-- 3. Lyrics timer (internal clock + drift threshold) -->
    <script src="lyrics.js"></script>

    <!-- 4. UI Controller (cover, title, artist, controls) -->
    <script src="ui_controller.js"></script>

    <!-- 5. Kawarp background -->
    <script type="module" src="bg.js"></script>
</body>
</html>
